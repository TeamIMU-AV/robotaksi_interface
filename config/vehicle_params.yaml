bridge_node:
  ros__parameters:
    # Farklı kartlar takıldığında otomatik bulması için tüm ID'leri listeleyebilirsiniz
    serial_paths: [
      "/dev/serial/by-id/usb-Arduino_LLC__www.arduino.cc__Genuino_Mega_2560_55639303534351F03101-if00", # Benim Evdeki Emektar
      "/dev/serial/by-id/usb-1a86_USB_Serial-if00-port0", # Labdan Bir Klon
      "/dev/serial/by-id/usb-Arduino__www.arduino.cc__0042_55130303335351A07022-if00" # Yeşil Ledli Bold Yazılı Mega
    ]
    baud_rate: 1000000
    
    # Kinematics Parameters (Gerekli Fiziksel Ölçüler)
    wheelbase_m: 2.28          # Dingil mesafesi (L): 228 cm (2280 mm). Ön ve arka akslar arası uzaklık.
    track_width_m: 1.26        # İz genişliği (T): 126 cm. DİKKAT: Odometri hesaplamalarında dönüş ekseni arka aks olduğu için bilinçli olarak 'Arka İz Genişliği' kullanılmıştır (Ön taraf 154 cm'dir).
    max_steer_angle_deg: 30.0  # Maksimum direksiyon dönüş açısı: Sola 30 derece, Sağa 30 derece (Toplam 60 derece aralık)
    max_steer_speed_deg_s: 10.0 # Maksimum direksiyon dönüş hızı (deg/s). Donanımsal ~5kHz sürücü sınırı.
    publish_tf: false          # Wheel odometry stays as a topic; localization owns the odom->base transform.

joystick_teleop:
  ros__parameters:
    max_speed: 3.0
    max_steer_deg: 30.0
    wheelbase_m: 2.28
